dag_type: plain_text
description: Create an agent to buy used sterling at $1/g using multiple concurrent
  steps.
name: buy_used_sterling
nodes:
  choose_exchange_platform:
    agent: false
    description: Choose the exchange platform based on the trading requirements.
    name: choose_exchange_platform
    nodes_depended_on:
    - define_trading_requirements
    nodes_dependent_on: []
    prompt: Based on the defined trading requirements, choose the most suitable exchange
      platform for buying used sterling at $1/g.
  collect_exchange_data:
    agent: false
    description: Collect market data and analyze prices and spreads
    name: collect_exchange_data
    nodes_depended_on:
    - select_market_makers
    nodes_dependent_on:
    - select_market_makers
    prompt: Collect market data from the selected market makers for buying used sterling
      at $1/g. Analyze the prices and spreads.
  define_trading_requirements:
    agent: false
    description: Define the trading requirements for buying used sterling at $1/g.
    name: define_trading_requirements
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Define the trading requirements for buying used sterling at $1/g. List
      the required input markets, instrument types, and currencies.
  generate_market_reports:
    agent: false
    description: Generate market reports based on trading outcomes.
    name: generate_market_reports
    nodes_depended_on:
    - liquidate_positions
    nodes_dependent_on:
    - liquidate_positions
    prompt: Generate market reports for buying used sterling at $1/g based on the
      trading outcomes.
  generate_trading_signals:
    agent: false
    description: Generate trade signals based on market data analysis.
    name: generate_trading_signals
    nodes_depended_on:
    - collect_exchange_data
    nodes_dependent_on:
    - collect_exchange_data
    prompt: Using the collected market data, generate buy signals for the chosen instrument
      and market makers.
  liquidate_positions:
    agent: false
    description: Liquidate open positions when trading conditions are met or orders
      expired.
    name: liquidate_positions
    nodes_depended_on:
    - monitor_market_conditions
    nodes_dependent_on:
    - monitor_market_conditions
    prompt: Liquidate open positions in used sterling at $1/g when the trading conditions
      are met or the orders are expired.
  monitor_market_conditions:
    agent: false
    description: Monitor market conditions and adjust orders if necessary
    name: monitor_market_conditions
    nodes_depended_on:
    - place_orders
    nodes_dependent_on:
    - place_orders
    prompt: Monitor market conditions for the open orders and adjust them as needed
      for buying used sterling at $1/g.
  place_orders:
    agent: false
    description: Place orders to buy sterling based on trading signals.
    name: place_orders
    nodes_depended_on:
    - generate_trading_signals
    nodes_dependent_on:
    - generate_trading_signals
    prompt: Place orders to buy used sterling at $1/g on the selected markets using
      the generated trading signals.
  select_market_makers:
    agent: false
    description: Select market makers for the chosen exchange platform
    name: select_market_makers
    nodes_depended_on:
    - choose_exchange_platform
    nodes_dependent_on:
    - choose_exchange_platform
    prompt: Select a list of market makers for the chosen exchange platform to buy
      used sterling at $1/g.
