dag_type: typed
description: Generated workflow from UI.
name: equitized_strategy_workflow
nodes:
  assess_credit_card_rate_impact:
    agent: false
    description: Assess the potential impact of the capped credit card rate on the
      market and investments.
    name: assess_credit_card_rate_impact
    nodes_depended_on:
    - define_market_conditions
    nodes_dependent_on: []
    output_structure:
    - description: High-level summary of how the credit card rate cap impacts market
        dynamics
      key: market_impact_summary
      type: str
    - description: Projected percentage change in consumer spending due to the rate
        cap
      key: consumer_spending_forecast
      type: float
    - description: Estimated percentage change in business loan demand based on the
        rate cap
      key: business_loan_demand_change
      type: float
    - description: List of industries most significantly impacted by the credit card
        rate cap
      key: affected_industries
      type: List[str]
    - description: Assessment of increased/decreased investment risk categories (e.g.,
        high/medium/low)
      key: investment_risk_assessment
      type: str
    - description: Quantitative measure of expected market volatility changes
      key: market_volatility_indicator
      type: float
    - description: Whether the assessed impact necessitates changes to the equitized
        strategy
      key: requires_strategy_adjustment
      type: bool
    prompt: Analyze how the capped credit card rate of 10% for 1 year will affect
      the market and potential investments.
  define_market_conditions:
    agent: false
    description: Define the current market conditions to inform the equitized strategy.
    name: define_market_conditions
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of key economic trends (e.g., inflation rates, consumer spending
        patterns)
      key: economic_trends
      type: List[str]
    - description: List of critical economic data points like GDP growth, unemployment
        rates, and manufacturing indices
      key: key_economic_indicators
      type: List[str]
    - description: Summary of investor sentiment categorized as 'Bullish', 'Neutral',
        or 'Bearish'
      key: market_sentiment
      type: str
    - description: 'Overview of performance levels for major economic sectors (e.g.,
        ''Technology: High Growth'', ''Energy: Stable'')'
      key: sector_performances
      type: List[str]
    - description: Description of prevailing interest rates including central bank
        rates and lending rates
      key: current_interest_rates
      type: str
    - description: Boolean flag indicating if market data is validated and current
      key: is_data_valid
      type: bool
    prompt: Describe the current market conditions, including any relevant economic
      trends or indicators.
  determine_investment_horizon:
    agent: false
    description: Determine the investment horizon to ensure the equitized strategy
      is aligned with market conditions.
    name: determine_investment_horizon
    nodes_depended_on:
    - assess_credit_card_rate_impact
    nodes_dependent_on: []
    output_structure:
    - description: Recommended investment timeframe (e.g., 'short-term' or specific
        duration like '6 months')
      key: optimal_timeframe
      type: str
    - description: List of primary factors influencing the investment horizon determination
      key: key_factors
      type: List[str]
    - description: Whether the investment horizon is fixed or flexible
      key: is_fixed_horizon
      type: bool
    - description: Suggested market position based on the determined horizon (e.g.,
        'hold', 'rebalance quarterly')
      key: recommended_action
      type: str
    prompt: Determine the optimal investment horizon for the next 6 months, considering
      the capped credit card rate and market conditions.
  develop_equitized_strategy:
    agent: false
    description: Develop a comprehensive equitized strategy for the next 6 months.
    name: develop_equitized_strategy
    nodes_depended_on:
    - determine_investment_horizon
    nodes_dependent_on: []
    output_structure:
    - description: A concise summary of the equitized strategy and its key objectives
      key: strategy_summary
      type: str
    - description: List of primary asset classes and their recommended allocation
        percentages
      key: key_asset_allocations
      type: List[str]
    - description: Numerical representation of risk level (0.0=low to 1.0=high)
      key: risk_profile
      type: float
    - description: List of projected annualized return targets for different time
        horizons
      key: performance_targets
      type: List[float]
    - description: Explanation of the strategic reasoning behind the proposed allocations
        and timing
      key: strategy_rationale
      type: str
    prompt: Create an equitized strategy that takes into account the capped credit
      card rate, market conditions, and investment horizon.
  implement_investment_plan:
    agent: false
    description: Implement the investment plan, ensuring alignment with the equitized
      strategy and market conditions.
    name: implement_investment_plan
    nodes_depended_on:
    - select_investment_vehicles
    nodes_dependent_on: []
    output_structure:
    - description: List of selected investment vehicles (e.g., ETFs, stocks, bonds)
        confirmed for implementation
      key: confirmed_investment_vehicles
      type: List[str]
    - description: List of asset allocation percentages for each investment vehicle
      key: allocated_assets_percentages
      type: List[float]
    - description: Date when the investment plan was executed in YYYY-MM-DD format
      key: execution_date
      type: str
    - description: Total value of assets allocated in the implemented plan (in USD
        million)
      key: total_assets_under_management
      type: float
    - description: Flag indicating whether the implementation was successfully completed
      key: is_implementation_complete
      type: bool
    prompt: Execute the investment plan, allocating assets according to the equitized
      strategy and investment horizon.
  select_investment_vehicles:
    agent: false
    description: Select the investment vehicles that align with the equitized strategy
      and investment horizon.
    name: select_investment_vehicles
    nodes_depended_on:
    - develop_equitized_strategy
    nodes_dependent_on: []
    output_structure:
    - description: Names of the selected investment vehicles (e.g., mutual funds,
        ETFs, individual stocks).
      key: vehicle_names
      type: List[str]
    - description: Risk categorization for each selected vehicle (e.g., low, medium,
        high).
      key: risk_levels
      type: List[str]
    - description: Projected annualized returns for each selected vehicle in percentage
        terms.
      key: expected_returns
      type: List[float]
    - description: Liquidity classification for each vehicle (e.g., highly liquid,
        semi-liquid).
      key: liquidity_status
      type: List[str]
    - description: Key factors used to evaluate and select each investment vehicle.
      key: selection_criteria
      type: List[str]
    - description: Indicates whether regulatory or internal approval is needed before
        implementation.
      key: is_approval_required
      type: bool
    prompt: Choose the most suitable investment vehicles for the equitized strategy,
      considering factors such as risk, return, and liquidity.
